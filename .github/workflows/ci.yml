name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native-windows:
    name: Native core + GDExtension (Windows x86_64)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # godot-cpp generates its bindings with Python at configure time.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure
        run: cmake --preset windows-x64 -DGODOTCPP_TARGET=template_debug

      - name: Build
        run: cmake --build --preset windows-x64-debug --parallel

      # Core tests + tools_loopback_test. The GPU encoder tests skip themselves
      # (test_encode prints SKIP per missing backend, test_stream skips without
      # any encoder), so a GPU-less runner is fine as long as the Media
      # Foundation software encoder exists, which tools_loopback_test needs.
      - name: Native tests (CTest)
        # tools_loopback_test needs a working H.264 encoder (GPU, or Media
        # Foundation on a desktop image); hosted runners may have neither, so
        # it runs locally before releases.
        run: ctest --preset windows-x64-debug --timeout 300 -E tools_loopback_test

      - uses: actions/upload-artifact@v4
        with:
          name: gdextension-windows-x86_64-debug
          path: godot-addon/addons/handview/bin/*.dll
          if-no-files-found: error

  native-macos:
    name: Native core + GDExtension (macOS arm64)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ninja
        run: brew install ninja

      - name: Configure
        run: cmake --preset macos-arm64 -DGODOTCPP_TARGET=template_debug

      - name: Build
        run: cmake --build --preset macos-arm64-debug --parallel

      # Hosted macOS runners are VMs and may lack the VideoToolbox hardware
      # encoder; test_encode then prints SKIP and test_stream skips itself.
      - name: Native tests (CTest)
        run: ctest --preset macos-arm64-debug --timeout 300

      - uses: actions/upload-artifact@v4
        with:
          name: gdextension-macos-arm64-debug
          path: godot-addon/addons/handview/bin/*.dylib
          if-no-files-found: error

  android:
    name: Android app (debug APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, debug APK, lint
        run: ./gradlew :protocol:test :client:test :app:assembleDebug :app:lintDebug

      - uses: actions/upload-artifact@v4
        with:
          name: handview-debug-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # Doubles as the Godot 4.4 compatibility check: the addon, the debug
  # GDExtension and the GDScript tests all run on the oldest supported editor.
  godot-addon:
    name: Godot addon tests (Godot 4.4.1)
    runs-on: windows-latest
    needs: native-windows
    env:
      GODOT_VERSION: 4.4.1-stable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: gdextension-windows-x86_64-debug
          path: godot-addon/addons/handview/bin

      - name: Download Godot
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o godot.zip             "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_win64.exe.zip"
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          # The console build keeps stdout and the exit code attached.
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_win64_console.exe" >> "$GITHUB_ENV"

      - name: Import project
        shell: bash
        run: |
          set -euo pipefail
          # Not --import: a first editor run that exits immediately can crash
          # while it still generates docs for GDExtension classes (DECISIONS
          # D17). Letting the editor run ~1500 frames avoids that race.
          "$GODOT_BIN" --headless --path godot-addon --editor --quit-after 1500

      - name: Run addon tests
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path godot-addon -s res://tests/run_tests.gd
