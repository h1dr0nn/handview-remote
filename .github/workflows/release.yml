name: Release

# Push a tag like v0.1.0 to publish. The tag must match handview.versionName in
# android-app/gradle.properties and the version in plugin.cfg, and CHANGELOG.md
# must have a "## [0.1.0]" section. Tags with a suffix (v0.2.0-rc.1) are
# published as pre-releases.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  # Cheap checks first so a bad tag or missing secret fails before any build.
  prepare:
    name: Validate tag, version and secrets
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      version_code: ${{ steps.meta.outputs.version_code }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets
        env:
          HANDVIEW_KEYSTORE_BASE64: ${{ secrets.HANDVIEW_KEYSTORE_BASE64 }}
          HANDVIEW_KEYSTORE_PASSWORD: ${{ secrets.HANDVIEW_KEYSTORE_PASSWORD }}
          HANDVIEW_KEY_ALIAS: ${{ secrets.HANDVIEW_KEY_ALIAS }}
          HANDVIEW_KEY_PASSWORD: ${{ secrets.HANDVIEW_KEY_PASSWORD }}
        run: |
          missing=0
          for name in HANDVIEW_KEYSTORE_BASE64 HANDVIEW_KEYSTORE_PASSWORD HANDVIEW_KEY_ALIAS HANDVIEW_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing secret::GitHub secret $name is not set. Create it under Settings > Secrets and variables > Actions."
              missing=1
            fi
          done
          exit $missing

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check version and changelog
        id: meta
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not a semantic version (expected vMAJOR.MINOR.PATCH)"
            exit 1
          fi
          props=android-app/gradle.properties
          gradle_name=$(sed -n 's/^handview\.versionName=//p' "$props" | tr -d '\r')
          gradle_code=$(sed -n 's/^handview\.versionCode=//p' "$props" | tr -d '\r')
          plugin_version=$(sed -n 's/^version="\(.*\)"$/\1/p' godot-addon/addons/handview/plugin.cfg | tr -d '\r')
          if [ "$gradle_name" != "$version" ]; then
            echo "::error::Tag version $version does not match handview.versionName=$gradle_name in $props"
            exit 1
          fi
          if ! [[ "$gradle_code" =~ ^[0-9]+$ ]]; then
            echo "::error::handview.versionCode in $props is not an integer: '$gradle_code'"
            exit 1
          fi
          if [ "$plugin_version" != "$version" ]; then
            echo "::error::Tag version $version does not match version=\"$plugin_version\" in plugin.cfg"
            exit 1
          fi
          python tools/package/changelog_section.py "$version" > release-notes.md
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_code=$gradle_code" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  native-release:
    name: Native GDExtension (Release, Windows x86_64)
    needs: prepare
    runs-on: windows-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # godot-cpp generates its bindings with Python at configure time.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure
        run: cmake --preset windows-x64 -DGODOTCPP_TARGET=template_release

      - name: Build
        run: cmake --build --preset windows-x64-release --parallel

      - uses: actions/upload-artifact@v4
        with:
          name: gdextension-windows-x86_64-release
          path: godot-addon/addons/handview/bin/handview.windows.template_release.x86_64.dll
          if-no-files-found: error

  android-release:
    name: Signed release APK
    needs: prepare
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          HANDVIEW_KEYSTORE_BASE64: ${{ secrets.HANDVIEW_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$HANDVIEW_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/handview-release.keystore"
          echo "HANDVIEW_KEYSTORE_FILE=$RUNNER_TEMP/handview-release.keystore" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          HANDVIEW_KEYSTORE_PASSWORD: ${{ secrets.HANDVIEW_KEYSTORE_PASSWORD }}
          HANDVIEW_KEY_ALIAS: ${{ secrets.HANDVIEW_KEY_ALIAS }}
          HANDVIEW_KEY_PASSWORD: ${{ secrets.HANDVIEW_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      # An unsigned APK would be named app-release-unsigned.apk, so this also
      # fails the job if signing silently did not apply.
      - name: Verify APK signature
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$apksigner" verify --print-certs "$apk"

      - uses: actions/upload-artifact@v4
        with:
          name: handview-release-apk
          path: android-app/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/handview-release.keystore"

  publish:
    name: Package and publish
    needs: [prepare, native-release, android-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: gdextension-windows-x86_64-release
          path: inputs/dll

      - uses: actions/download-artifact@v4
        with:
          name: handview-release-apk
          path: inputs/apk

      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: inputs/notes

      - name: Package addon zip
        run: |
          set -euo pipefail
          python tools/package/package.py \
            --dll inputs/dll/handview.windows.template_release.x86_64.dll \
            --apk inputs/apk/app-release.apk \
            --version "$VERSION" \
            --version-code "$VERSION_CODE" \
            --out dist
          cp inputs/apk/app-release.apk "dist/handview-$VERSION.apk"
          ls -l dist
          (cd dist && sha256sum -c "handview-godot-addon-$VERSION.zip.sha256")

      - uses: softprops/action-gh-release@v2
        with:
          name: Handview ${{ env.VERSION }}
          body_path: inputs/notes/release-notes.md
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: |
            dist/handview-godot-addon-${{ env.VERSION }}.zip
            dist/handview-godot-addon-${{ env.VERSION }}.zip.sha256
            dist/handview-${{ env.VERSION }}.apk
